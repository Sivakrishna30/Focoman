spring:
  application:
    name: focoman-backend
  
  # Database Configuration - Supports both H2 (dev) and PostgreSQL (prod)
  datasource:
    # PostgreSQL for production (Railway will provide SPRING_DATASOURCE_URL)
    # H2 for local development (fallback)
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/focomandb;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    
    # Connection Pool Configuration (HikariCP - Spring Boot default)
    hikari:
      # Connection pool settings
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 20000  # 20 seconds
      idle-timeout: 600000       # 10 minutes
      max-lifetime: 1800000      # 30 minutes
      leak-detection-threshold: 60000  # 1 minute (detect connection leaks)
      
      # Connection validation
      connection-test-query: ${DB_VALIDATION_QUERY:SELECT 1}
      validation-timeout: 5000   # 5 seconds
      
      # Pool name for monitoring
      pool-name: FocomanHikariPool
  
  jpa:
    # Database dialect - auto-detected based on driver
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      # Use 'validate' in production, 'update' in development
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # Batch processing for better performance
        batch_size: 25
        order_inserts: true
        order_updates: true
        # Query cache
        cache:
          use_second_level_cache: false
          use_query_cache: false
  
  # H2 Console - only enable in development
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  
  # Connection timeout settings
  connection-timeout: 20000  # 20 seconds
  max-http-request-header-size: 16KB
  
  # Error handling
  error:
    include-message: always
    include-binding-errors: always

# Application Configuration
app:
  env: ${APP_ENV:local}

# Logging Configuration
logging:
  level:
    com.focoman: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_LOG_LEVEL:TRACE}
    com.zaxxer.hikari: ${HIKARI_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints for monitoring (optional)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always